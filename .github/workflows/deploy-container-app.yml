name: Build and deploy Azure Container App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image and deploy revision
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          acrName: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          imageToBuild: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/allsport-freunde:${{ github.sha }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          ingress: external
          targetPort: 3000
          buildArguments: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          disableTelemetry: true
